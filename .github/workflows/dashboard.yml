# Daily rebuild of the static dashboard from committed snapshots + a fresh DefiLlama pull.
# BigQuery refresh (data/metrics from new on-chain days) is a deliberate local step: no cloud credentials live in CI.
name: dashboard
on:
  push: {branches: [main]}
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:
concurrency: {group: pages, cancel-in-progress: true}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen python -m pipeline.defillama
      - run: uv run --frozen python -m pipeline.peers
      - run: uv run --frozen python -m pipeline.model
      - run: uv run --frozen python -m dashboard.build
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd dashboard && npm ci --no-audit --no-fund && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_SITE_URL: "https://emekamanuel.github.io"
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard/out}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
